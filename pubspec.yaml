name: gridsentinel
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  csv: 6.0.0
  file_picker: 10.3.8
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  mqtt_client: ^10.5.0
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - assets/models/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
